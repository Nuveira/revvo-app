name: PHP CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Show PHP version
        run: php -v

      - name: Cek syntax semua file PHP
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Cek debug statements (var_dump, print_r, die)
        run: |
          FOUND=$(grep -rn --include="*.php" "var_dump\|print_r\|die(" . --exclude-dir=vendor || true)
          if [ -n "$FOUND" ]; then
            echo "GAGAL: ada debug statement yang belum dihapus:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK: tidak ada debug statement"

      - name: Cek file PHP tidak kosong
        run: |
          EMPTY=$(find . -type f -name "*.php" -not -path "./vendor/*" -empty)
          if [ -n "$EMPTY" ]; then
            echo "GAGAL: ada file PHP yang kosong:"
            echo "$EMPTY"
            exit 1
          fi
          echo "OK: semua file PHP tidak kosong"
